services:
  db:
    image: postgres:15.10-alpine
    container_name: next_train_db_cont
    restart: always
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - db_vol:/var/lib/postgresql/data/
      - ./data/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
      - ./data/populate_db.sql:/docker-entrypoint-initdb.d/populate_db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER && psql -U $$POSTGRES_USER -d $$DB_NAME -tAc 'SELECT COUNT(*) FROM schedule' | grep -qv '^0'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    env_file:
      - .env.prod

  backend:
    image: whitenz/next_train:latest
    container_name: next_train_backend_cont
    volumes:
      - data_vol:/app/logs/
    depends_on:
      db:
        condition: service_healthy
    restart: always
    env_file:
      - .env.prod

volumes:
  db_vol:
  data_vol: