[project]
name = "next-train-telegram-bot"
version = "0.1.0"
description = "TelegramBot for inform you about next train in metro Yekaterinburg"
authors = [{ name = "Ilya Kolesnikov", email = "zloy-gamer@yandex.ru" }]
requires-python = ">=3.12,<3.14"
readme = "README.MD"
dependencies = [
    "python-telegram-bot[job-queue]~=20.5",
    "sqlalchemy>=2.0.21,<3",
    "asyncpg>=0.28.0,<0.29",
    "psycopg2-binary>=2.9.6,<3",
    "pydantic-settings>=2.0.3,<3",
    "pydantic>=2.10.3",
]

[dependency-groups]
dev = [
    "freezegun>=1.5.5",
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=0.23.0",
    "pytest-dotenv>=0.5.2",
    "testcontainers[postgres]>=4.15.0",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = [
  "src",
]
testpaths = [
  "tests",
]
python_files = [
  "test_*.py",
]
env_override_existing_values = 1
env_files = ".env.test"
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"
